<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask about Haroon Riasat</title>
    <meta name="description" content="Chat with an AI assistant that answers questions about Haroon Riasat's experience, projects, and skills, grounded only in his resume." />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='64' height='64' rx='32' fill='url(%23g)'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-size='26' font-weight='700' fill='white'>HR</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="landing">
    <div class="glow" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Start over">
        <span class="avatar sm" aria-hidden="true">HR</span>
        <span class="brand-name">Haroon Riasat</span>
      </a>
      <nav class="social" aria-label="Contact">
        <a href="mailto:haroonriasatali@gmail.com" aria-label="Email" title="Email"><span class="ic" data-icon="mail"></span></a>
        <a href="https://linkedin.com/in/haroon-riasat-82659b1a7" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><span class="ic" data-icon="linkedin"></span></a>
        <a href="https://github.com/HaroonRiasat1" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><span class="ic" data-icon="github"></span></a>
      </nav>
    </header>

    <main class="shell">
      <section class="hero" id="hero">
        <div class="avatar xl" aria-hidden="true">HR</div>
        <p class="hello">Hey, I'm Haroon's AI assistant 👋</p>
        <h1>Full-Stack &amp; AI Engineer</h1>
        <p class="sub">Ask me anything about his experience, projects and skills. I answer only from his resume.</p>
      </section>

      <div class="thread" id="chat" aria-live="polite"></div>

      <div class="dock">
        <form id="form" autocomplete="off">
          <input id="input" type="text" maxlength="400" placeholder="Ask me anything…" aria-label="Your question" />
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <div class="quick" id="quick"></div>
        <p class="fine" id="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
